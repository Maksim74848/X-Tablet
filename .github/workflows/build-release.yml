name: X-Tablet Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "1.0.0"

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: client/go.mod

      - name: Build
        working-directory: client
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          go build -trimpath -ldflags="-s -w" -o dist/windows/X-Tablet.exe .

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            installer/windows/X-Tablet.iss

      - name: Verify
        shell: pwsh
        run: |
          if (!(Test-Path "installer/windows/dist/X-Tablet-Windows-Setup.exe")) {
            throw "Windows installer not created"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: installer/windows/dist/X-Tablet-Windows-Setup.exe

  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: client/go.mod

      - name: Build
        working-directory: client
        run: |
          mkdir -p dist/linux

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build \
            -trimpath \
            -ldflags="-s -w" \
            -o dist/linux/X-Tablet .

          chmod +x dist/linux/X-Tablet
          cp license-server.txt dist/linux/license-server.txt

          printf '%s\n' \
            'X-Tablet Linux x64' \
            '' \
            'Запустите X-Tablet через графический интерфейс.' \
            > dist/linux/README.txt

          tar -C dist/linux -czf X-Tablet-Linux-x64.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: client/X-Tablet-Linux-x64.tar.gz

  macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: client/go.mod

      - name: Build
        working-directory: client
        run: |
          mkdir -p dist/macos/X-Tablet.app/Contents/MacOS
          mkdir -p dist/macos/X-Tablet.app/Contents/Resources

          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 \
            go build \
            -trimpath \
            -ldflags="-s -w" \
            -o dist/macos/X-Tablet-amd64 .

          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
            go build \
            -trimpath \
            -ldflags="-s -w" \
            -o dist/macos/X-Tablet-arm64 .

          lipo -create \
            -output dist/macos/X-Tablet \
            dist/macos/X-Tablet-amd64 \
            dist/macos/X-Tablet-arm64

          cp dist/macos/X-Tablet \
            dist/macos/X-Tablet.app/Contents/MacOS/X-Tablet

          cp license-server.txt \
            dist/macos/X-Tablet.app/Contents/Resources/license-server.txt

          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<plist version="1.0">' \
            '<dict>' \
            '<key>CFBundleDisplayName</key><string>X-Tablet</string>' \
            '<key>CFBundleExecutable</key><string>X-Tablet</string>' \
            '<key>CFBundleIdentifier</key><string>com.xtablet.app</string>' \
            '<key>CFBundleName</key><string>X-Tablet</string>' \
            '<key>CFBundlePackageType</key><string>APPL</string>' \
            '<key>CFBundleVersion</key><string>1.0.0</string>' \
            '<key>CFBundleShortVersionString</key><string>1.0.0</string>' \
            '</dict>' \
            '</plist>' \
            > dist/macos/X-Tablet.app/Contents/Info.plist

          chmod +x dist/macos/X-Tablet.app/Contents/MacOS/X-Tablet

          hdiutil create \
            -volname X-Tablet \
            -srcfolder dist/macos/X-Tablet.app \
            -ov \
            -format UDZO \
            dist/X-Tablet-macOS.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: client/dist/X-Tablet-macOS.dmg

  publish:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: release

      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: release

      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: release

      - name: Free package
        working-directory: release
        run: |
          mkdir free

          cp X-Tablet-Windows-Setup.exe free/
          cp X-Tablet-Linux-x64.tar.gz free/
          cp X-Tablet-macOS.dmg free/

          printf '%s\n' \
            'X-Tablet Free' \
            'Windows + Linux x64 + macOS' \
            > free/README.txt

          zip -r X-Tablet-Free.zip free

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${APP_VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v${APP_VERSION}" \
              release/X-Tablet-Windows-Setup.exe \
              release/X-Tablet-Linux-x64.tar.gz \
              release/X-Tablet-macOS.dmg \
              release/X-Tablet-Free.zip \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "v${APP_VERSION}" \
              release/X-Tablet-Windows-Setup.exe \
              release/X-Tablet-Linux-x64.tar.gz \
              release/X-Tablet-macOS.dmg \
              release/X-Tablet-Free.zip \
              --title "X-Tablet ${APP_VERSION}" \
              --notes "X-Tablet release" \
              --latest \
              --repo "$GITHUB_REPOSITORY"
          fi
