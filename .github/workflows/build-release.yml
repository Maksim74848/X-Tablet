name: X-Tablet Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "1.0.0"

jobs:

  # =========================================================
  # WINDOWS
  # =========================================================

  windows:
    name: Windows build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: client/go.mod

      - name: Build X-Tablet
        working-directory: client
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows | Out-Null

          go build `
            -trimpath `
            -ldflags="-s -w" `
            -o dist/windows/X-Tablet.exe .

      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path "client/dist/windows/X-Tablet.exe")) {
            throw "X-Tablet.exe was not created"
          }

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "installer/windows/X-Tablet.iss"

          if (!(Test-Path "installer/windows/dist/X-Tablet-Windows-Setup.exe")) {
            throw "Windows installer was not created"
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: xtablet-windows
          path: installer/windows/dist/X-Tablet-Windows-Setup.exe
          if-no-files-found: error


  # =========================================================
  # LINUX
  # =========================================================

  linux:
    name: Linux x64 build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: client/go.mod

      - name: Build Linux
        working-directory: client
        shell: bash
        run: |
          mkdir -p dist/linux

          CGO_ENABLED=0 \
          GOOS=linux \
          GOARCH=amd64 \
          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o dist/linux/X-Tablet .

          chmod +x dist/linux/X-Tablet

          cp license-server.txt dist/linux/license-server.txt

          cat > dist/linux/README.txt <<'EOF'
X-Tablet

Linux x64 edition.

Пользователю не требуется запускать команды терминала
для активации или настройки лицензии.

Запустите X-Tablet через графический интерфейс.
EOF

          tar \
            -C dist/linux \
            -czf X-Tablet-Linux-x64.tar.gz \
            .

      - name: Verify Linux package
        shell: bash
        run: |
          test -f client/X-Tablet-Linux-x64.tar.gz

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: xtablet-linux
          path: client/X-Tablet-Linux-x64.tar.gz
          if-no-files-found: error


  # =========================================================
  # MACOS
  # =========================================================

  macos:
    name: macOS universal build
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: client/go.mod

      - name: Build macOS universal binary
        working-directory: client
        shell: bash
        run: |
          mkdir -p dist/macos/X-Tablet.app/Contents/MacOS
          mkdir -p dist/macos/X-Tablet.app/Contents/Resources

          CGO_ENABLED=0 \
          GOOS=darwin \
          GOARCH=amd64 \
          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o dist/macos/X-Tablet-amd64 .

          CGO_ENABLED=0 \
          GOOS=darwin \
          GOARCH=arm64 \
          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o dist/macos/X-Tablet-arm64 .

          lipo \
            -create \
            -output dist/macos/X-Tablet \
            dist/macos/X-Tablet-amd64 \
            dist/macos/X-Tablet-arm64

          cp dist/macos/X-Tablet \
             dist/macos/X-Tablet.app/Contents/MacOS/X-Tablet

          cp license-server.txt \
             dist/macos/X-Tablet.app/Contents/Resources/license-server.txt

          cat > dist/macos/X-Tablet.app/Contents/Info.plist <<'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
"https://www.apple.com/DTDs/PropertyList-1.0.dtd">

<plist version="1.0">
<dict>
    <key>CFBundleDisplayName</key>
    <string>X-Tablet</string>

    <key>CFBundleExecutable</key>
    <string>X-Tablet</string>

    <key>CFBundleIdentifier</key>
    <string>com.xtablet.app</string>

    <key>CFBundleName</key>
    <string>X-Tablet</string>

    <key>CFBundlePackageType</key>
    <string>APPL</string>

    <key>CFBundleVersion</key>
    <string>1.0.0</string>

    <key>CFBundleShortVersionString</key>
    <string>1.0.0</string>
</dict>
</plist>
EOF

          chmod +x \
            dist/macos/X-Tablet.app/Contents/MacOS/X-Tablet

          hdiutil create \
            -volname "X-Tablet" \
            -srcfolder dist/macos/X-Tablet.app \
            -ov \
            -format UDZO \
            dist/X-Tablet-macOS.dmg

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: xtablet-macos
          path: client/dist/X-Tablet-macOS.dmg
          if-no-files-found: error


  # =========================================================
  # RELEASE + FREE PACKAGE
  # =========================================================

  publish:
    name: Publish X-Tablet release
    needs:
      - windows
      - linux
      - macos

    runs-on: ubuntu-latest

    steps:

      - name: Download Windows
        uses: actions/download-artifact@v4
        with:
          name: xtablet-windows
          path: release

      - name: Download Linux
        uses: actions/download-artifact@v4
        with:
          name: xtablet-linux
          path: release

      - name: Download macOS
        uses: actions/download-artifact@v4
        with:
          name: xtablet-macos
          path: release

      - name: Build free package
        working-directory: release
        shell: bash
        run: |
          mkdir free

          cp X-Tablet-Windows-Setup.exe free/
          cp X-Tablet-Linux-x64.tar.gz free/
          cp X-Tablet-macOS.dmg free/

          cat > free/README.txt <<'EOF'
X-Tablet Free

Бесплатная сборка X-Tablet.

В комплекте:
- Windows installer
- Linux x64
- macOS

Пользователю не требуется консоль для установки.
EOF

          zip -r X-Tablet-Free.zip free

      - name: Create or update Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |

          if gh release view "v${APP_VERSION}" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          then

            gh release upload \
              "v${APP_VERSION}" \
              release/X-Tablet-Windows-Setup.exe \
              release/X-Tablet-Linux-x64.tar.gz \
              release/X-Tablet-macOS.dmg \
              release/X-Tablet-Free.zip \
              --clobber \
              --repo "$GITHUB_REPOSITORY"

          else

            gh release create \
              "v${APP_VERSION}" \
              release/X-Tablet-Windows-Setup.exe \
              release/X-Tablet-Linux-x64.tar.gz \
              release/X-Tablet-macOS.dmg \
              release/X-Tablet-Free.zip \
              --title "X-Tablet ${APP_VERSION}" \
              --notes "Автоматическая сборка X-Tablet." \
              --latest \
              --repo "$GITHUB_REPOSITORY"

          fi
