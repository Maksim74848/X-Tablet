<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07111d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>X‑Tablet</title>
<link rel="manifest" href="/manifest.json">
<style>
:root{--bg:#06101a;--panel:#0b1827;--panel2:#0e2032;--line:#1c3349;--text:#edf6fd;--muted:#8da4b9;--accent:#60a5fa;--good:#38d6a0;--warn:#f7c75c;--danger:#ff7488;--shadow:0 18px 55px rgba(0,0,0,.24)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0%,#10253c 0,#07111d 42%,#040a11 100%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #7dd3fc;outline-offset:2px}
.app{min-height:100vh;display:grid;grid-template-columns:244px minmax(0,1fr)}.sidebar{position:sticky;top:0;height:100vh;padding:18px 14px;border-right:1px solid var(--line);background:rgba(4,13,22,.84);backdrop-filter:blur(18px)}.brand{display:flex;align-items:center;gap:11px;padding:7px 8px 20px}.logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#7dd3fc,#3b82f6);color:#04101b;font-weight:950;box-shadow:0 12px 30px rgba(59,130,246,.24)}.brand b{font-size:18px}.brand span{display:block;margin-top:2px;color:var(--muted);font-size:11px}.nav{display:grid;gap:5px}.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border:1px solid transparent;border-radius:13px;background:transparent;color:var(--muted);text-align:left}.nav button.active{background:#0d2033;border-color:#1c3851;color:var(--text)}.nav .ic{width:22px;text-align:center}.side-status{position:absolute;left:14px;right:14px;bottom:14px;padding:11px;border:1px solid var(--line);border-radius:13px;background:#07131f}.dot{display:inline-block;width:8px;height:8px;margin-right:7px;border-radius:50%;background:#64748b}.dot.on{background:var(--good);box-shadow:0 0 0 5px rgba(56,214,160,.11)}
.main{min-width:0;padding:20px 20px 30px}.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}.title{margin:3px 0 0;font-size:30px;line-height:1.1;letter-spacing:-.035em}.kicker{font-size:10px;font-weight:850;letter-spacing:.15em;text-transform:uppercase;color:#7dd3fc}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:9px 13px;border:1px solid var(--line);border-radius:12px;background:#0e2032;color:var(--text)}.btn.primary{border-color:#3b82f6;background:linear-gradient(135deg,#3b82f6,#2563eb)}.btn.ghost{background:transparent}.btn:disabled{cursor:not-allowed;opacity:.45}
.grid{display:grid;gap:14px}.cols2{grid-template-columns:repeat(2,minmax(0,1fr))}.cols3{grid-template-columns:repeat(3,minmax(0,1fr))}.panel{min-width:0;padding:16px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,rgba(14,32,50,.97),rgba(8,20,33,.97));box-shadow:var(--shadow)}.hero{padding:25px}.hero h2{margin:7px 0 8px}.hero p{max-width:760px;color:#b7c9d9;line-height:1.6}.section-title{margin-bottom:11px;font-weight:780}.muted{color:var(--muted)}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;min-width:0}.row.wrap{flex-wrap:wrap}.pill,.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 9px;border:1px solid var(--line);border-radius:999px;background:#081827;color:#bbd1e3;font-size:11px}.pill.live{color:#9af3d2;border-color:rgba(56,214,160,.22)}.notice{padding:14px;border:1px dashed #24425d;border-radius:14px;background:#071522;color:#b7c9d9;line-height:1.5}.notice strong{color:var(--text)}
.statgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.stat{min-width:0;padding:13px;border:1px solid #172c40;border-radius:14px;background:#081522}.stat label{display:block;color:var(--muted);font-size:9px;letter-spacing:.08em;text-transform:uppercase}.stat strong{display:block;margin-top:6px;font-size:22px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stat span{display:block;margin-top:5px;color:var(--muted);font-size:10px}
.action-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.action{width:100%;padding:15px;border:1px solid #17324a;border-radius:15px;background:#091927;color:var(--text);text-align:left}.action:hover,.cmd:hover{border-color:#2b628f;background:#0d2134}.action strong{display:block}.action small{display:block;margin-top:5px;color:var(--muted);line-height:1.35}.commandgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.cmd{min-width:0;min-height:72px;padding:11px;border:1px solid #19354c;border-radius:13px;background:#071523;color:var(--text);text-align:left}.cmd b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cmd small{display:block;margin-top:5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.search{width:min(260px,100%);min-height:40px;padding:9px 11px;border:1px solid var(--line);border-radius:12px;background:#071523;color:var(--text)}.select{min-height:40px;padding:9px 11px;border:1px solid var(--line);border-radius:12px;background:#071523;color:var(--text)}
.gauge{position:relative;min-height:190px;overflow:hidden}.gauge .face{position:absolute;inset:28px;border:2px solid #28465f;border-radius:50%}.gauge .face:before,.gauge .face:after{content:"";position:absolute;left:50%;bottom:50%;transform-origin:bottom center;border-radius:4px}.gauge .face:before{width:2px;height:42%;background:#f1f7fb;transform:translateX(-50%) rotate(var(--needle,0deg))}.gauge .face:after{width:8px;height:8px;background:#f1f7fb;transform:translate(-50%,50%)}.gauge .center{position:absolute;left:50%;top:50%;transform:translate(-50%,-8%);text-align:center}.gauge .value{font-size:28px;font-weight:850}.gauge .unit{font-size:10px;color:var(--muted)}
.horizon{position:relative;min-height:370px;overflow:hidden;background:linear-gradient(#3d86b9 0 49%,#5d432a 50% 100%)}.horizon:before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:#f2f7fb}.horizon .ladder{position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0 38px,rgba(255,255,255,.65) 39px 40px,transparent 41px 76px);transform:rotate(var(--bank,0deg));opacity:.42}.horizon .plane{position:absolute;left:50%;top:50%;font-size:47px;transform:translate(-50%,-50%);filter:drop-shadow(0 8px 15px rgba(0,0,0,.22))}.map{position:relative;height:470px;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:linear-gradient(135deg,#081b25,#0c2933 55%,#08161f)}.map:before,.map:after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:36px 36px}.route{position:absolute;left:-15%;top:53%;width:130%;height:2px;background:linear-gradient(90deg,transparent,#6ee7b7 24%,#60a5fa 73%,transparent);transform:rotate(-18deg);box-shadow:0 0 18px rgba(96,165,250,.45)}.mapplane{position:absolute;left:50%;top:50%;font-size:36px;transform:translate(-50%,-50%) rotate(var(--hdg,0deg));filter:drop-shadow(0 8px 14px rgba(0,0,0,.45));z-index:2}.maplabel{position:absolute;left:14px;right:14px;bottom:14px;display:flex;gap:7px;flex-wrap:wrap;z-index:3}
.list{display:grid;gap:7px}.listitem{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;border:1px solid #173047;border-radius:12px;background:#071523}.listitem span{min-width:0;line-height:1.35}.listitem input{width:18px;height:18px;flex:0 0 auto}.pairing{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.qrbox{display:grid;place-items:center;min-height:300px;padding:18px;border:1px solid var(--line);border-radius:18px;background:#fff}.qrbox canvas{display:block;max-width:230px;width:100%;height:auto}.bigurl{margin-top:11px;font-weight:800;text-align:center;font-size:20px;line-height:1.3;overflow-wrap:anywhere}.footerline{margin-top:18px;color:#5b758b;font-size:11px}
.mobilebar{display:none}.sheet-backdrop{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.72);backdrop-filter:blur(12px)}.sheet{width:min(760px,100%);max-height:min(860px,92vh);overflow:auto;padding:22px;border:1px solid #24425c;border-radius:22px;background:#091827;box-shadow:0 30px 90px rgba(0,0,0,.5)}.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.close{border:1px solid var(--line);background:#071523;color:var(--text);width:38px;height:38px;border-radius:11px}.pair-steps{display:grid;gap:9px;margin-top:15px}.step{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}.step-num{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;background:#12304a;color:#9fd9ff;font-weight:800}.phone-connect{display:grid;gap:12px}.success-card{padding:18px;border:1px solid rgba(56,214,160,.25);border-radius:16px;background:rgba(56,214,160,.07)}
#toast{position:fixed;left:50%;bottom:24px;z-index:150;max-width:calc(100vw - 24px);padding:10px 14px;border:1px solid #23425f;border-radius:12px;background:#0d2134;color:var(--text);opacity:0;pointer-events:none;transform:translate(-50%,12px);transition:.2s}.visible{opacity:1!important;transform:translate(-50%,0)!important}
@media(max-width:960px){.app{grid-template-columns:1fr}.sidebar{display:none}.main{padding:14px 12px 88px}.cols2,.cols3,.pairing{grid-template-columns:1fr}.statgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.action-grid{grid-template-columns:1fr}.commandgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.mobilebar{position:fixed;left:8px;right:8px;bottom:8px;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:6px;border:1px solid var(--line);border-radius:17px;background:rgba(8,20,33,.95);backdrop-filter:blur(18px);box-shadow:0 15px 40px rgba(0,0,0,.35)}.mobilebar button{border:0;border-radius:10px;background:transparent;color:var(--muted);padding:8px 3px}.mobilebar button.active{background:#10263b;color:var(--text)}.mobilebar button span{display:block;font-size:16px;line-height:1}.mobilebar small{display:block;margin-top:3px;font-size:9px}.topbar{align-items:flex-start}.actions{width:100%;justify-content:flex-start}.horizon{min-height:290px}.map{height:360px}}
@media(max-width:540px){.main{padding:11px 10px 86px}.title{font-size:25px}.hero{padding:18px}.panel{padding:13px;border-radius:16px}.stat strong{font-size:20px}.commandgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.cmd{min-height:64px;padding:10px}.search{width:100%}.row.mobile-stack{flex-direction:column;align-items:stretch}.sheet{padding:17px;border-radius:18px}.sheet h2{font-size:24px}.qrbox{min-height:250px}.pairing{gap:12px}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="logo">XT</div><div><b>X‑Tablet</b><span>Flight companion</span></div></div>
    <nav id="nav" class="nav"></nav>
    <div class="side-status"><div><span id="dot" class="dot"></span><span id="statusText">Поиск X‑Plane…</span></div><div id="version" class="muted" style="font-size:11px;margin-top:6px">Запустите X‑Plane 12</div></div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div><div class="kicker">X‑Plane 12 companion</div><h1 id="pageTitle" class="title">Главная</h1></div>
      <div class="actions"><button class="btn" onclick="openPairing()">📱 Подключить телефон</button><button class="btn primary" onclick="location.reload()">↻</button></div>
    </div>
    <div id="content"></div>
    <div class="footerline">X‑Tablet работает локально. Лицензия проверяется отдельно и хранится на этом ПК.</div>
  </main>
</div>
<div id="mobilebar" class="mobilebar"></div>
<div id="toast"></div>
<script>
'use strict';
const NAV=[['home','⌂','Главная'],['flight','◈','Приборы'],['map','⌖','Карта'],['systems','▣','Системы'],['controls','✦','Кнопки'],['account','👤','Аккаунт'],['license','🔑','Лицензия'],['diagnostics','⚙','Диагностика'],['more','☰','Ещё']];
const TITLES=Object.fromEntries(NAV.map(x=>[x[0],x[2]]));
let logTimer=null;
const CHECKS={"Перед вылетом":["BAT / GEN","HYDRAULIC","FLAPS","TRIM","FLIGHT CONTROLS","DOORS","BRAKE","TAKEOFF DATA"],"Перед посадкой":["LANDING GEAR","FLAPS","SPEEDBRAKE","AUTOBRAKE","LIGHTS","CABIN"],"После посадки":["PARKING BRAKE","ENGINES","ANTI ICE","LIGHTS"]};
const state={page:'home',status:{online:false,xp_version:'',local_url:'',ip:''},flight:{},commands:[],license:{activated:false,device_id:'',plan:'',expires_at:0,license_key:'',last_error:'',telegram_user_id:'',telegram_first_name:'',telegram_last_name:'',telegram_username:''},selectedProfile:localStorage.getItem('xt_profile')||'Default',phase:localStorage.getItem('xt_phase')||'Перед вылетом',checklist:JSON.parse(localStorage.getItem('xt_check')||'{}')};
const names={ias:['IAS','kt'],alt:['ALT','ft'],vs:['V/S','fpm'],hdg:['HDG','°'],pitch:['PITCH','°'],bank:['BANK','°'],gs:['GS','kt'],track:['TRK','°'],fuel:['FUEL','kg'],lat:['LAT',''],lon:['LON',''],wind:['WIND','kt'],windDir:['WIND DIR','°'],temp:['OAT','°C'],press:['QNH','inHg'],gear:['GEAR','%'],flap:['FLAPS','%'],eng1:['ENG 1 N1','%'],eng2:['ENG 2 N1','%']};
const fmt=(v,d=0)=>Number.isFinite(Number(v))?Number(v).toFixed(d):'—';
function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\'':'&#39;','"':'&quot;'}[c]));}
function nav(){document.querySelector('#nav').innerHTML=NAV.map(n=>`<button class="${state.page===n[0]?'active':''}" onclick="go('${n[0]}')"><span class="ic">${n[1]}</span><span>${n[2]}</span></button>`).join('');document.querySelector('#mobilebar').innerHTML=NAV.slice(0,5).map(n=>`<button class="${state.page===n[0]?'active':''}" onclick="go('${n[0]}')"><span>${n[1]}</span><small>${n[2]}</small></button>`).join('');}
function stat(k,v,d=0){const [l,u]=names[k]||[k,''];return `<div class="stat"><label>${l}</label><strong data-live="${k}" data-d="${d}">${fmt(v,d)}</strong><span>${u}</span></div>`;}
function gauge(label,val,unit,needle){const key=({IAS:'ias',ALT:'alt',HDG:'hdg'})[label]||label.toLowerCase();return `<section class="panel gauge"><div class="face" data-live-needle="${key}" style="--needle:${Number(needle||0)}deg"></div><div class="center"><div class="kicker">${label}</div><div class="value" data-live="${key}" data-d="0">${fmt(val)}</div><div class="unit">${unit}</div></div></section>`;}
function checklist(){const arr=CHECKS[state.phase]||[];const done=arr.filter((_,i)=>state.checklist[state.phase+'_'+i]).length;return `<div class="row wrap"><div><div class="section-title">Checklist</div><div class="muted">${done}/${arr.length} выполнено</div></div><select class="select" onchange="setPhase(this.value)">${Object.keys(CHECKS).map(x=>`<option ${x===state.phase?'selected':''}>${escapeHtml(x)}</option>`).join('')}</select></div><div class="list" style="margin-top:12px">${arr.map((x,i)=>{const k=state.phase+'_'+i;return `<label class="listitem"><span>${escapeHtml(x)}</span><input type="checkbox" ${state.checklist[k]?'checked':''} onchange="setCheck('${escapeHtml(k)}',this.checked)"></label>`}).join('')}</div>`;}
function home(){if(!state.status.online)return `<div class="grid"><section class="panel hero"><div class="kicker">Первый запуск</div><h2 class="title">X‑Tablet готовится к полёту</h2><p>Запустите X‑Plane 12. X‑Tablet автоматически проверяет локальный Web API. Когда симулятор будет найден, статус сменится на <b>LIVE</b>.</p><div class="row wrap" style="margin-top:18px"><button class="btn primary" onclick="location.reload()">↻ Проверить X‑Plane</button><span class="pill">ПК готов к подключению телефона</span></div></section><section class="panel pairing"><div><div class="section-title">Телефон подключается отсюда</div><p class="muted">На ПК нажмите <b>«Подключить телефон»</b>. Появится QR-код. Сканируйте его камерой телефона.</p><button class="btn primary" onclick="openPairing()">📱 Подключить телефон</button></div><div class="notice"><strong>Важно:</strong> ПК и телефон должны быть в одной Wi‑Fi сети. На телефоне ничего устанавливать не нужно.</div></section></div>`;
return `<div class="grid"><section class="panel hero"><div class="kicker">Live flight deck</div><div class="row wrap"><div><h2 class="title">X‑Plane подключён</h2><p style="margin:8px 0 0">Симулятор найден. Телефон можно подключить в один шаг через QR-код.</p></div><span class="pill live">● LIVE</span></div><div class="row wrap" style="margin-top:18px"><span class="muted">X‑Plane ${escapeHtml(state.status.xp_version||'')}</span><button class="btn primary" onclick="openPairing()">📱 Подключить телефон</button></div></section><section class="panel"><div class="section-title">Полёт сейчас</div><div class="statgrid">${stat('ias',state.flight.ias)}${stat('alt',state.flight.alt)}${stat('vs',state.flight.vs)}${stat('hdg',state.flight.hdg)}</div></section><section class="action-grid"><button class="action" onclick="go('flight')"><strong>◈ Приборы</strong><small>PFD, горизонт и основные параметры</small></button><button class="action" onclick="go('map')"><strong>⌖ Карта</strong><small>Позиция, курс, ветер и данные GPS</small></button><button class="action" onclick="go('controls')"><strong>✦ Кнопки</strong><small>Команды напрямую в X‑Plane</small></button></section><section class="panel"><div class="section-title">Быстрые действия</div><div class="commandgrid"><button class="cmd" onclick="send('sim/autopilot/servos_toggle')"><b>AP</b><small>Autopilot</small></button><button class="cmd" onclick="send('sim/autopilot/TOGA_press')"><b>TO/GA</b><small>Go-around</small></button><button class="cmd" onclick="send('sim/flight_controls/landing_gear_down')"><b>GEAR ↓</b><small>Gear down</small></button><button class="cmd" onclick="send('sim/flight_controls/park_brake_toggle')"><b>PARK</b><small>Parking brake</small></button></div></section></div>`;}


async function refreshLicense(){try{const r=await fetch('/api/license/status',{cache:'no-store'});if(!r.ok)throw new Error();state.license={...state.license,...await r.json()};}catch{state.license={...state.license,last_error:'Не удалось получить состояние лицензии'};}}
async function activateLicense(){const input=document.querySelector('#licenseInput');const key=(input?.value||'').trim();if(!key){toast('Введите ключ лицензии');return;}const btn=document.querySelector('#licenseBtn');if(btn){btn.disabled=true;btn.textContent='Активация…';}try{const r=await fetch('/api/license/activate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({license_key:key})});if(!r.ok){const text=await r.text();throw new Error(text||'Активация не выполнена');}await refreshLicense();toast('Лицензия активирована');render();}catch(e){toast('Ошибка активации');const err=document.querySelector('#licenseError');if(err)err.textContent=e?.message||'Ошибка';}finally{if(btn){btn.disabled=false;btn.textContent='Активировать';}}}
function licensePage(){const l=state.license;const active=l.activated&&l.expires_at>Math.floor(Date.now()/1000);return `<div class="grid"><section class="panel hero"><div class="kicker">Лицензия X‑Tablet</div><h2 class="title">${active?'✅ Лицензия активна':'🔐 Активируйте X‑Tablet'}</h2><p>${active?'Текущий ПК привязан к вашему ключу. Лицензия проверяется сервером и автоматически обновляется по heartbeat.':'После покупки ключ приходит вам в Telegram. Введите его один раз — текущий ПК будет привязан к лицензии.'}</p>${active?`<div class="statgrid" style="margin-top:16px"><div class="stat"><label>Тариф</label><strong>${escapeHtml(l.plan||'—')}</strong><span>подписка</span></div><div class="stat"><label>До</label><strong>${l.expires_at?new Date(l.expires_at*1000).toLocaleDateString('ru-RU'):'—'}</strong><span>дата окончания</span></div><div class="stat"><label>Device ID</label><strong>${escapeHtml(l.device_id||'—')}</strong><span>этот ПК</span></div><div class="stat"><label>Проверка</label><strong>${l.last_validated_at?new Date(l.last_validated_at*1000).toLocaleTimeString('ru-RU'):'—'}</strong><span>${l.last_error?'есть ошибка':'сервер доступен'}</span></div></div><div class="notice" style="margin-top:14px"><strong>Ключ:</strong> <code>${escapeHtml(l.license_key||'—')}</code><br><span class="muted">Для переноса на другой ПК используйте /resetdevice в Telegram-боте.</span></div>`:`<div class="panel" style="margin-top:16px;padding:15px"><label class="muted">Лицензионный ключ</label><input id="licenseInput" class="search" style="width:100%;margin-top:8px;min-height:48px" placeholder="XT-XXXXX-XXXXX-XXXXX-XXXXX" autocomplete="off" spellcheck="false"><div class="row wrap" style="margin-top:10px"><button id="licenseBtn" class="btn primary" onclick="activateLicense()">Активировать</button><span id="licenseError" class="muted">${escapeHtml(l.last_error||'')}</span></div></div><div class="notice" style="margin-top:14px"><strong>Где взять ключ?</strong> После оплаты откройте сообщение Telegram-бота X‑Tablet. Ключ находится прямо в нём.</div>`}</section></div>`;}

let accountLinkCode='';
let accountTimer=null;
function accountFullName(){return [state.license.telegram_first_name,state.license.telegram_last_name].filter(Boolean).join(' ') || ''}
function accountPage(){const l=state.license;const name=accountFullName();if(l.telegram_user_id){const until=l.expires_at?new Date(l.expires_at*1000).toLocaleDateString('ru-RU'):'—';return `<div class="grid"><section class="panel hero"><div class="kicker">Telegram account</div><h2 class="title">${escapeHtml(name||'Аккаунт подключён')}</h2><p>${l.telegram_username?`@${escapeHtml(l.telegram_username)} · `:''}<span class="muted">Telegram ID ${escapeHtml(l.telegram_user_id)}</span></p><div class="statgrid" style="margin-top:16px"><div class="stat"><label>Тариф</label><strong>${escapeHtml(l.plan||'Нет')}</strong><span>подписка</span></div><div class="stat"><label>До</label><strong>${until}</strong><span>дата окончания</span></div><div class="stat"><label>ПК</label><strong>${l.activated?'Активирован':'Не активирован'}</strong><span>${escapeHtml(l.device_id||'—')}</span></div><div class="stat"><label>Статус</label><strong>${l.last_error?'Ошибка':'Готов'}</strong><span>${escapeHtml(l.last_error||'Связь с сервером работает')}</span></div></div><div class="row wrap" style="margin-top:16px"><button class="btn primary" onclick="refreshLicense();render()">↻ Обновить</button><button class="btn" onclick="startTelegramLink()">🔗 Перепривязать Telegram</button></div></section><section class="panel"><div class="section-title">Что подтягивается автоматически</div><div class="list">${['Имя и фамилия из Telegram','@username, если он открыт','Тариф подписки','Дата окончания','Состояние активации этого ПК'].map(x=>`<div class="listitem"><span>${escapeHtml(x)}</span><span class="pill live">✓</span></div>`).join('')}</div></section></div>`}
return `<div class="grid"><section class="panel hero"><div class="kicker">Вход через Telegram</div><h2 class="title">Ваш аккаунт ещё не подключён</h2><p>Нажмите кнопку. X‑Tablet откроет Telegram-бота с одноразовым кодом. После подтверждения имя, тариф и срок подписки появятся здесь автоматически.</p><div class="row wrap" style="margin-top:18px"><button class="btn primary" onclick="startTelegramLink()">📲 Войти через Telegram</button></div><div id="accountLinkState" class="notice" style="margin-top:14px">Код действует 10 минут.</div></section></div>`}
async function startTelegramLink(){try{const r=await fetch('/api/account/start',{method:'POST',headers:{'Content-Type':'application/json'}});if(!r.ok)throw new Error(await r.text());const d=await r.json();accountLinkCode=d.code;window.open(d.bot_url, '_blank', 'noopener,noreferrer');document.querySelector('#accountLinkState')?.replaceChildren(document.createTextNode('Открыл Telegram. Нажмите Start в боте — здесь статус обновится автоматически.'));clearInterval(accountTimer);accountTimer=setInterval(async()=>{try{const p=await fetch('/api/account/poll?code='+encodeURIComponent(accountLinkCode),{cache:'no-store'});if(!p.ok)throw new Error();const v=await p.json();if(v.linked){clearInterval(accountTimer);await refreshLicense();if(state.license.expires_at>Math.floor(Date.now()/1000)&&!state.license.activated){const c=await fetch('/api/account/claim',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:accountLinkCode})});if(c.ok)await refreshLicense();}render();toast('Telegram подключён');}}catch{ /* keep polling until expiry */}},1500);}catch(e){toast('Не удалось открыть Telegram');const el=document.querySelector('#accountLinkState');if(el)el.textContent=e.message||'Ошибка';}}

function diagnostics(){return `<div class="grid"><section class="panel hero"><div class="kicker">Состояние системы</div><h2 class="title">Диагностика X‑Tablet</h2><p class="muted">Здесь можно проверить, что видит X‑Tablet и есть ли свежие данные от X‑Plane.</p><div class="statgrid" style="margin-top:16px"><div class="stat"><label>X‑Plane</label><strong>${state.status.online?'LIVE':'OFFLINE'}</strong><span>${escapeHtml(state.status.xp_version||'—')}</span></div><div class="stat"><label>API</label><strong>${escapeHtml(state.status.api_version||'—')}</strong><span>REST + WebSocket</span></div><div class="stat"><label>Data age</label><strong id="diagAge">—</strong><span>мс</span></div><div class="stat"><label>LAN</label><strong>${escapeHtml(state.status.ip||'—')}</strong><span>локальная сеть</span></div></div></section><section class="panel"><div class="row wrap"><div><div class="section-title">Журнал</div><div class="muted">Последние события bridge. Токены и секреты в журнал не записываются.</div></div><button class="btn" onclick="loadLogs()">↻ Обновить</button></div><pre id="logs" style="margin-top:12px;max-height:420px;overflow:auto;padding:13px;border:1px solid var(--line);border-radius:14px;background:#050e16;color:#b7c9d9;white-space:pre-wrap;word-break:break-word;font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace">Загрузка…</pre></section><section class="panel"><div class="section-title">Файл журнала</div><div id="logPath" class="muted">—</div><div class="notice" style="margin-top:12px"><strong>Что проверять при проблеме:</strong> статус X‑Plane, возраст последних данных, появление ошибок WebSocket или Command в журнале.</div></section></div>`;}

const pages={home,account:accountPage,license:licensePage,flight:()=>`<div class="grid"><section class="cols3 grid">${gauge('IAS',state.flight.ias,'KT',state.flight.ias/2)}${gauge('ALT',state.flight.alt,'FT',state.flight.pitch*2)}${gauge('HDG',state.flight.hdg,'DEG',state.flight.hdg)}</section><section class="panel horizon" style="--bank:${Number(state.flight.bank||0)}deg"><div class="ladder"></div><div class="plane">✈</div></section><section class="panel"><div class="statgrid">${stat('pitch',state.flight.pitch,1)}${stat('bank',state.flight.bank,1)}${stat('vs',state.flight.vs)}${stat('gs',state.flight.gs,1)}${stat('track',state.flight.track,1)}${stat('fuel',state.flight.fuel,0)}${stat('gear',Number(state.flight.gear||0)*100,0)}${stat('flap',Number(state.flight.flap||0)*100,0)}</div></section></div>`,map:()=>`<div class="grid"><section class="map"><div class="route"></div><div class="mapplane" style="--hdg:${Number(state.flight.track||0)}deg">✈</div><div class="maplabel"><span class="chip">${fmt(state.flight.lat,4)}°</span><span class="chip">${fmt(state.flight.lon,4)}°</span><span class="chip">TRK ${fmt(state.flight.track)}°</span><span class="chip">WIND ${fmt(state.flight.wind)} kt / ${fmt(state.flight.windDir)}°</span></div></section><section class="panel"><div class="statgrid">${stat('lat',state.flight.lat,4)}${stat('lon',state.flight.lon,4)}${stat('track',state.flight.track)}${stat('wind',state.flight.wind)}${stat('windDir',state.flight.windDir)}${stat('alt',state.flight.alt)}</div></section></div>`,systems:()=>`<div class="grid"><section class="cols2 grid"><div class="panel"><div class="section-title">Окружающая среда</div><div class="statgrid">${stat('temp',state.flight.temp,1)}${stat('press',state.flight.press,2)}${stat('wind',state.flight.wind)}${stat('windDir',state.flight.windDir)}</div></div><div class="panel"><div class="section-title">Двигатели и топливо</div><div class="statgrid">${stat('eng1',state.flight.eng1,1)}${stat('eng2',state.flight.eng2,1)}${stat('fuel',state.flight.fuel)}${stat('gear',Number(state.flight.gear||0)*100)}</div></div></section><section class="panel">${checklist()}</section></div>`,controls:()=>`<div class="grid"><section class="panel"><div class="row wrap"><div><div class="section-title">Горячие кнопки</div><div class="muted">Реальные X‑Plane Commands. Набор обновляется автоматически.</div></div><input id="q" class="search" placeholder="Поиск команды…" oninput="renderCommands()"></div><div id="commands" class="commandgrid" style="margin-top:14px"></div></section></div>`,more:()=>`<div class="grid cols2"><section class="panel"><div class="section-title">Профиль</div><select class="select" onchange="setProfile(this.value)"><option ${state.selectedProfile==='Default'?'selected':''}>Default</option><option ${state.selectedProfile==='Airliner'?'selected':''}>Airliner</option><option ${state.selectedProfile==='GA'?'selected':''}>General Aviation</option><option ${state.selectedProfile==='Custom'?'selected':''}>Custom</option></select><p class="muted">Профили будут определять layouts, приборы и горячие кнопки для разных самолётов.</p></section><section class="panel"><div class="section-title">Лицензия</div><p class="muted">Введите ключ, который бот выдал после покупки.</p><button class="btn primary" onclick="go('license')">🔑 Открыть лицензии</button></section><section class="panel"><div class="section-title">Телефон / планшет</div><p class="muted">Подключается с телефона через QR-код с этого компьютера.</p><button class="btn primary" onclick="openPairing()">📱 Открыть подключение</button></section><section class="panel"><div class="section-title">Локальные данные</div><button class="btn" onclick="localStorage.clear();location.reload()">Сбросить настройки</button></section></div>`};

async function loadLogs(){try{const r=await fetch('/api/logs?n=160',{cache:'no-store'});if(!r.ok)throw new Error(await r.text());const d=await r.json();const el=document.querySelector('#logs');if(el)el.textContent=(d.lines||[]).join('\n')||'Журнал пока пуст.';const path=document.querySelector('#logPath');if(path)path.textContent=d.path||'—';}catch(e){const el=document.querySelector('#logs');if(el)el.textContent='Не удалось прочитать журнал: '+(e?.message||e);}}
async function refreshDiagnostics(){if(state.page!=='diagnostics')return;try{const r=await fetch('/api/diagnostics',{cache:'no-store'});if(!r.ok)throw new Error();const d=await r.json();const a=document.querySelector('#diagAge');if(a)a.textContent=d.last_data_age_ms>=0?String(d.last_data_age_ms):'—';const path=document.querySelector('#logPath');if(path)path.textContent=d.log_path||'—';}catch{}}
function render(){nav();document.querySelector('#pageTitle').textContent=TITLES[state.page]||'X‑Tablet';document.querySelector('#content').innerHTML=(pages[state.page]||home)();updateChrome();if(logTimer){clearInterval(logTimer);logTimer=null;}if(state.page==='controls')renderCommands();if(state.page==='diagnostics'){loadLogs();refreshDiagnostics();logTimer=setInterval(()=>{loadLogs();refreshDiagnostics();},4000);}}
function updateChrome(){const on=state.status.online;document.querySelector('#dot').className='dot '+(on?'on':'');document.querySelector('#statusText').textContent=on?'X‑Plane подключён':'Поиск X‑Plane…';document.querySelector('#version').textContent=on?'Версия '+(state.status.xp_version||'—'):'Запустите X‑Plane 12';}
function updateLiveDOM(){document.querySelectorAll('[data-live]').forEach(el=>{const k=el.getAttribute('data-live');const d=Number(el.getAttribute('data-d')||0);el.textContent=fmt(state.flight[k],d);});document.querySelectorAll('[data-live-needle]').forEach(el=>{const k=el.getAttribute('data-live-needle');let deg=Number(state.flight[k]||0);if(k==='ias')deg=deg/2;if(k==='alt')deg=Number(state.flight.pitch||0)*2;el.style.setProperty('--needle',deg+'deg');});const h=document.querySelector('.horizon');if(h)h.style.setProperty('--bank',Number(state.flight.bank||0)+'deg');const mp=document.querySelector('.mapplane');if(mp)mp.style.setProperty('--hdg',Number(state.flight.track||0)+'deg');}
function go(p){state.page=p;render();}
function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.classList.add('visible');clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.classList.remove('visible'),1700);}
async function send(name){try{const r=await fetch('/api/commands/activate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,duration:0})});if(!r.ok)throw new Error();toast('Команда отправлена');}catch{toast('Команда недоступна');}}
function renderCommands(){const el=document.querySelector('#commands');if(!el)return;const q=(document.querySelector('#q')?.value||'').trim().toLowerCase();const arr=state.commands.filter(x=>(x.name||'').toLowerCase().includes(q)||(x.description||'').toLowerCase().includes(q)).slice(0,80);el.replaceChildren();if(!arr.length){el.innerHTML='<div class="muted">Команды появятся после подключения X‑Plane.</div>';return;}arr.forEach(x=>{const b=document.createElement('button');b.className='cmd';const title=(x.name||'').split('/').pop().replaceAll('_',' ');b.innerHTML=`<b>${escapeHtml(title.length>28?title.slice(0,28)+'…':title)}</b><small>${escapeHtml(x.description||x.name||'')}</small>`;b.onclick=()=>send(x.name);el.appendChild(b);});}
function setPhase(v){state.phase=v;localStorage.setItem('xt_phase',v);render();}
function setCheck(k,v){state.checklist[k]=v;localStorage.setItem('xt_check',JSON.stringify(state.checklist));render();}
function setProfile(v){state.selectedProfile=v;localStorage.setItem('xt_profile',v);toast('Профиль сохранён');}
async function openPairing(){const baseUrl=state.status.local_url||location.origin;const url=baseUrl+(baseUrl.includes('?')?'&':'?')+'pair=1';const wrap=document.createElement('div');wrap.className='sheet-backdrop';wrap.innerHTML=`<div class="sheet"><div class="sheet-head"><div><div class="kicker">Подключение устройства</div><h2 class="title">Телефон → X‑Tablet</h2></div><button class="close" onclick="this.closest('.sheet-backdrop').remove()">✕</button></div><div class="pairing" style="margin-top:18px"><div><div class="notice"><strong>Сделайте это на телефоне:</strong><div class="pair-steps"><div class="step"><div class="step-num">1</div><div>Убедитесь, что телефон и ПК подключены к одной Wi‑Fi сети.</div></div><div class="step"><div class="step-num">2</div><div>Откройте камеру телефона.</div></div><div class="step"><div class="step-num">3</div><div>Наведите камеру на QR-код справа.</div></div><div class="step"><div class="step-num">4</div><div>На телефоне появится экран <b>«Подключиться к X‑Tablet»</b>. Нажмите кнопку <b>«Подключиться»</b>.</div></div></div></div><div class="bigurl">${escapeHtml(url.replace(/\?token=.*$/,''))}</div><button class="btn" style="margin-top:12px" onclick="navigator.clipboard?.writeText('${escapeHtml(url)}');toast('Адрес скопирован')">Скопировать адрес</button></div><div><div id="qrBox" class="qrbox"><div class="muted" style="text-align:center">Готовим QR-код…</div></div></div></div><div class="notice" style="margin-top:14px">После подключения телефон можно положить рядом с монитором. Никакого отдельного приложения для телефона не требуется.</div></div>`;document.body.appendChild(wrap);const target=wrap.querySelector('#qrBox');try{const r=await fetch('/api/qr',{cache:'no-store'});if(!r.ok)throw new Error('qr');const blob=await r.blob();const img=document.createElement('img');img.alt='QR-код подключения';img.style.maxWidth='230px';img.style.width='100%';img.src=URL.createObjectURL(blob);target.replaceChildren(img);}catch{fallbackQR(target,url);}}
function fallbackQR(target,url){target.innerHTML=`<div style="text-align:center;color:#0b1827"><div style="font-size:42px">▦</div><strong>QR не загрузился</strong><div style="margin-top:8px;font-size:13px">Откройте адрес вручную:</div><div style="margin-top:6px;word-break:break-all;font-weight:800">${escapeHtml(url)}</div></div>`;}
function maybeShowPhoneConnect(){const params=new URLSearchParams(location.search);if(params.get('pair')!=='1'||localStorage.getItem('xt_paired')==='1')return;const wrap=document.createElement('div');wrap.className='sheet-backdrop';wrap.innerHTML=`<div class="sheet"><div class="kicker">X‑Tablet</div><h2 class="title" style="margin-top:6px">Подключиться к X‑Tablet?</h2><p class="muted" style="line-height:1.6;margin-top:12px">Этот телефон подключается к локальному X‑Plane companion на вашем компьютере. После подключения откроется основной интерфейс.</p><div class="success-card" style="margin-top:15px"><strong>ПК и телефон в одной Wi‑Fi сети</strong><div class="muted" style="margin-top:5px">Соединение остаётся внутри вашей локальной сети.</div></div><div class="phone-connect" style="margin-top:16px"><button class="btn primary" onclick="localStorage.setItem('xt_paired','1');history.replaceState({},'',location.pathname);this.closest('.sheet-backdrop').remove();toast('Телефон подключён');render()">✓ Подключиться</button><button class="btn ghost" onclick="history.replaceState({},'',location.pathname);this.closest('.sheet-backdrop').remove()">Не сейчас</button></div></div>`;document.body.appendChild(wrap);}
const es=new EventSource('/events');es.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='status'){state.status=m.data||state.status;state.flight=state.status.flight||state.flight;render();}if(m.type==='flight'){state.flight=m.data||state.flight;updateChrome();updateLiveDOM();}if(m.type==='commands'){state.commands=m.data||[];if(state.page==='controls')renderCommands();}}catch{}};es.onerror=()=>{if(state.status.online){state.status.online=false;updateChrome();toast('Связь с X‑Tablet потеряна');}};
refreshLicense().then(()=>{render();maybeShowPhoneConnect();});
</script>
</body>
</html>
